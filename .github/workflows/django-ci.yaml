name: TestDjango
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start services
        run: docker compose up -d --build
      - name: Run tests
        run: docker compose exec web pytest
      - name: Stop services
        if: always()
        run: docker compose down -v