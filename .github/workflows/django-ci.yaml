name: TestDjango
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - run: pip install ruff
      - run: pip install -r requirements.txr
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
