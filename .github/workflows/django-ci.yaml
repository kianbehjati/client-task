name: CodeQuality
on: [push, workflow_dispatch]
jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: install ruff
        run: pip install ruff

      - name: lint
        run: ruff check .
      
      - name: format
        run: ruff format --check .